---
backend: pacman
skip_if_no_internet: true
update_db: false
update_system: false

operations:
  # Remove tools that only make sense on the live medium
  - try_remove:
      - calamares
      - mkinitcpio-archiso
      - arch-install-scripts
      - clonezilla
      - darkhttpd
      - memtest86+
      - memtest86+-efi
      - syslinux
      - edk2-shell
      - livecd-sounds
      - grml-zsh-config
      - archinstall

  # Optional: install a few nice defaults on the target system
  # (uncomment if you want them by default)
  # - try_install:
  #     - firefox
  #     - neo vim
  #     - htop
  #     - fastfetch
