LABEL arch
TEXT HELP
Boot the Oozy Linux live medium.
It allows you to install Oozy Linux or perform system maintenance.
ENDTEXT
MENU LABEL Boot Oozy Linux
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchfilename=/boot/archiso.uuid archisolabel=%ARCHISO_LABEL%

LABEL arch-ram
TEXT HELP
Boot Oozy Linux in RAM (copytoram)
ENDTEXT
MENU LABEL Boot Oozy Linux (copy to RAM)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchfilename=/boot/archiso.uuid archisolabel=%ARCHISO_LABEL% copytoram
